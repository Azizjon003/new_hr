services:
  postgres:
    image: postgres:16-alpine
    container_name: hr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_DB: ${POSTGRES_DB:-hr}
    volumes:
      - hr_pg_data:/var/lib/postgresql/data
    ports:
      # Host: 5433 (5432 da boshqa kontainer bo'lsa konflikt bo'lmaydi)
      # Bot ichida — bot 'postgres:5432' orqali ulanadi (docker network)
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hr}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hr_net

  redis:
    image: redis:7-alpine
    container_name: hr_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - hr_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - hr_net

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hr_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # DATABASE_URL va REDIS_URL endi to'g'ridan-to'g'ri .env dan o'qiladi
      # (.env da docker hostlari bo'lishi shart: postgres:5432, redis:6379)
      NODE_ENV: production
    volumes:
      - ./files:/app/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hr_net
    profiles:
      - prod

  # Seed — bir martalik buyruq:
  #   docker compose --profile seed run --rm seed
  # yoki tozalab qaytadan:
  #   docker compose --profile seed run --rm seed npm run seed:reset
  seed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hr_seed
    env_file:
      - .env
    environment:
      NODE_ENV: production
    command: npx tsx prisma/seed.ts
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hr_net
    profiles:
      - seed
    restart: "no"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hr_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - hr_net
    profiles:
      - tools

networks:
  hr_net:
    driver: bridge

volumes:
  hr_pg_data:
  hr_redis_data:
